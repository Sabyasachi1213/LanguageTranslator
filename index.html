<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Government English \u2192 Hindi Translator</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f6f4ef;color:#1d2a24;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:32px 20px 48px}
h1{margin:0 0 8px;font-size:30px}
p.sub{color:#5f6f68;margin:0 0 8px}
p.status{color:#0b6b4a;font-size:14px}
.card{background:#fff;border:1px solid #d9ddd6;border-radius:14px;padding:20px;margin-top:20px}
label{font-weight:650;display:block;margin-bottom:8px}
textarea{width:100%;border:1px solid #d9ddd6;border-radius:10px;padding:12px;font:inherit;box-sizing:border-box}
button{border:0;border-radius:999px;padding:11px 20px;font:inherit;font-weight:650;background:#0b6b4a;color:#fff;cursor:pointer;margin:14px 8px 0 0}
button.light{background:#eef1ec;color:#1d2a24}
button:disabled{opacity:.6}
#error{color:#b3261e}
#output{font-size:22px;line-height:1.7;background:#f2f7f3;border-radius:10px;padding:16px}
small{color:#5f6f68}
</style>
</head>
<body>
<main>
<p style="color:#e07b24;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;margin:0">MINIPRJ &middot; INDICTRANS2</p>
<h1>Government English &rarr; Hindi Translator</h1>
<p class="sub">Translate government and official English text into Hindi.</p>
<p class="status" id="health">Checking model status&hellip;</p>
<div class="card">
<label for="inputText">English text</label>
<textarea id="inputText" rows="6">The Government of India provides various services to citizens.</textarea><br>
<button id="go" type="button">Translate to Hindi</button>
<button class="light" id="clear" type="button">Clear</button>
<button class="light" id="sample" type="button">Try a sample</button>
<p id="error" hidden></p>
</div>
<div class="card" id="result" hidden>
<label>Hindi translation</label>
<p id="output" lang="hi"></p>
<p><small>Sentences: <b id="count">0</b> &nbsp; Government terms: <b id="terms">None detected</b></small></p>
<button class="light" id="copy" type="button">Copy translation</button>
</div>
<p><small>First translation downloads the model and may take a while.</small></p>
</main>
<script>
const input=document.getElementById('inputText'), go=document.getElementById('go'),
err=document.getElementById('error'), result=document.getElementById('result'),
out=document.getElementById('output'), health=document.getElementById('health');
async function check(){
  try{const r=await fetch('/api/health');const d=await r.json();
  health.textContent=d.model_loaded?('Model ready on '+d.device):('Model not loaded yet \u2014 it will load on the first translation');}
  catch{health.textContent='Could not reach the server.';}
}
go.onclick=async()=>{
  const text=input.value.trim(); err.hidden=true;
  if(!text){err.textContent='Please enter some English text first.';err.hidden=false;return;}
  go.disabled=true; go.textContent='Translating\u2026';
  try{const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  const d=await r.json(); if(!r.ok) throw new Error(d.error||('Server error '+r.status));
  out.textContent=d.hindi_translation; document.getElementById('count').textContent=d.sentence_count;
  document.getElementById('terms').textContent=d.terms_detected.length?d.terms_detected.join(', '):'None detected';
  result.hidden=false; check();}
  catch(e){err.textContent=e.message; err.hidden=false;}
  finally{go.disabled=false; go.textContent='Translate to Hindi';}
};
document.getElementById('clear').onclick=()=>{input.value='';result.hidden=true;err.hidden=true;input.focus();};
document.getElementById('sample').onclick=()=>{input.value='The Ministry has launched a new scheme for farmers. Citizens can apply online with a valid certificate.';};
document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(out.textContent);};
check();
</script>
</body>
</html>
